<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>LINE BOY – Rust + wgpu WASM</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="loading">
  <div>
    <div class="spin"></div>
    <p style="margin-top:14px">LOADING wgpu WebGL…</p>
  </div>
</div>

<div id="hud">
  <span>／ LINE BOY</span>
  <span>スコア <b id="score-val">0</b></span>
  <span id="world-val">WORLD 1: FOREST</span>
  <span id="boss-wrap">BOSS <span id="boss-bg"><div id="boss-fill"></div></span></span>
  <span style="margin-left:auto">FPS <b id="fps-val">--</b></span>
</div>

<div id="canvas-wrap">
  <canvas id="lineboy-canvas" width="1024" height="1024"></canvas>
</div>

<div class="overlay" id="title-screen">
  <h1>LINE BOY</h1>
  <p class="sub">ネオンな線画プラットフォーマー。全5ワールド、奥のボスを倒してゴールへ。</p>
  <div id="world-label">◀ WORLD 1: FOREST ▶</div>
  <button id="btn-start">▶ START</button>
  <div class="key-hint">
    左右で移動／A（Space）でジャンプ／敵は踏める<br>
    タイトル画面で ←→ を押すとワールドを選べます
  </div>
</div>

<div class="overlay hidden" id="over-screen">
  <p class="result-title">GAME OVER</p>
  <button id="btn-to-title">タイトルへ</button>
</div>

<div class="overlay hidden" id="clear-screen">
  <p class="result-title">CLEAR!</p>
  <p class="sub" id="clear-score"></p>
  <button id="btn-next">次のワールドへ ▶</button>
</div>

<div id="touch">
  <div class="grp">
    <button data-bit="1">◀</button>
    <button data-bit="2">▶</button>
  </div>
  <div class="grp">
    <button data-bit="16">A</button>
  </div>
</div>

<script type="module">
import init, * as wasm from './wasm/wasm_app.js';

// ── Audio (simple beeps, same spirit as the JS version) ─────────────────────
let actx = null;
function beep(freq, dur, type) {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0.05, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + dur);
  } catch (e) {}
}
const BEEPS = { 1: [440, 0.07, 'square'], 2: [880, 0.05, 'square'], 3: [160, 0.08, 'sawtooth'], 4: [110, 0.25, 'sawtooth'], 5: [220, 0.2, 'square'] };

// ── Input ────────────────────────────────────────────────────────────────────
let mask = 0;
const KEYMAP = {
  ArrowLeft: 1, KeyA: 1, ArrowRight: 2, KeyD: 2,
  Space: 16, KeyZ: 16, Enter: 16, ArrowUp: 16, KeyW: 16,
};
function applyMask() { wasm.set_input_lineboy(mask); }
document.addEventListener('keydown', e => {
  const bit = KEYMAP[e.code];
  if (bit) { e.preventDefault(); mask |= bit; applyMask(); }
});
document.addEventListener('keyup', e => {
  const bit = KEYMAP[e.code];
  if (bit) { e.preventDefault(); mask &= ~bit; applyMask(); }
});
window.addEventListener('pointerdown', () => { wasm.press_lineboy(); });
document.querySelectorAll('#touch button').forEach(btn => {
  const bit = parseInt(btn.dataset.bit, 10);
  const on = e => { e.preventDefault(); mask |= bit; applyMask(); if (bit === 16) wasm.press_lineboy(); };
  const off = e => { e.preventDefault(); mask &= ~bit; applyMask(); };
  btn.addEventListener('pointerdown', on);
  btn.addEventListener('pointerup', off);
  btn.addEventListener('pointerleave', off);
  btn.addEventListener('pointercancel', off);
});

// ── Overlays / HUD ───────────────────────────────────────────────────────────
const WORLD_NAMES = ['FOREST', 'DESERT', 'CAVE', 'GHOST', 'VOLCANO'];
const titleScreen = document.getElementById('title-screen');
const overScreen  = document.getElementById('over-screen');
const clearScreen = document.getElementById('clear-screen');
const scoreVal = document.getElementById('score-val');
const worldVal = document.getElementById('world-val');
const worldLabel = document.getElementById('world-label');
const bossWrap = document.getElementById('boss-wrap');
const bossFill = document.getElementById('boss-fill');
const clearScore = document.getElementById('clear-score');
const fpsVal = document.getElementById('fps-val');
const loadingEl = document.getElementById('loading');

let pendingPress = false;
function pressButton() { pendingPress = true; }
document.getElementById('btn-start').addEventListener('click', pressButton);
document.getElementById('btn-to-title').addEventListener('click', pressButton);
document.getElementById('btn-next').addEventListener('click', pressButton);

// scene: 0=title 1=play 2=over 3=clear
let lastScene = -1;
function loop(ts) {
  if (pendingPress) {
    const before = wasm.scene_lineboy();
    wasm.press_lineboy();
    wasm.tick_lineboy(ts);
    if (wasm.scene_lineboy() !== before) pendingPress = false;
  } else {
    wasm.tick_lineboy(ts);
  }
  const ev = wasm.audio_event_lineboy();
  if (ev && BEEPS[ev]) beep(...BEEPS[ev]);

  const scene = wasm.scene_lineboy();
  const world = wasm.world_lineboy();
  const wname = WORLD_NAMES[world] || '';
  scoreVal.textContent = wasm.score_lineboy();
  worldVal.textContent = `WORLD ${world + 1}: ${wname}`;
  if (scene === 0) worldLabel.textContent = `◀ WORLD ${world + 1}: ${wname} ▶`;
  if (wasm.boss_active_lineboy()) {
    bossWrap.classList.add('on');
    bossFill.style.width = Math.max(0, wasm.boss_hp_lineboy() / 5 * 100) + '%';
  } else {
    bossWrap.classList.remove('on');
  }
  if (scene !== lastScene) {
    lastScene = scene;
    titleScreen.classList.toggle('hidden', scene !== 0);
    overScreen.classList.toggle('hidden', scene !== 2);
    clearScreen.classList.toggle('hidden', scene !== 3);
    if (scene === 3) {
      clearScore.textContent = 'スコア ' + (wasm.score_total_lineboy() + wasm.score_lineboy());
    }
  }
  requestAnimationFrame(loop);
}

let fpsPrev = 0, fpsCount = 0;
function fpsLoop(ts) {
  if (fpsPrev > 0) {
    fpsCount++;
    if (ts - fpsPrev >= 500) {
      fpsVal.textContent = Math.round(fpsCount * 1000 / (ts - fpsPrev));
      fpsPrev = ts; fpsCount = 0;
    }
  } else fpsPrev = ts;
  requestAnimationFrame(fpsLoop);
}

async function main() {
  await init();
  await wasm.init_lineboy('lineboy-canvas');
  applyMask();
  loadingEl.style.display = 'none';
  requestAnimationFrame(loop);
  requestAnimationFrame(fpsLoop);
}
main().catch(err => {
  loadingEl.innerHTML = `<p style="color:#f44">ERROR: ${err}</p>`;
});
</script>
</body>
</html>
